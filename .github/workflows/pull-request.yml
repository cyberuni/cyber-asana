name: pull-request
on:
  pull_request:
    # `labeled`: Renovate adds its labels just after it opens the PR, and dep-changeset reads them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue builds a temporary merge-group branch and looks for the required
  # contexts there. It fires neither `pull_request` nor `push`, so without this trigger
  # a queued PR waits forever on checks that never start.
  merge_group:

# Cancel superseded runs on a PR, but never on a merge-group branch — cancelling
# there would stall the queue on a check that never reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named `code` so the roll-up reports as the required `code / all-checks`.
  code:
    uses: ./.github/workflows/code.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      REPOBUDDY_APP_ID: ${{ secrets.REPOBUDDY_APP_ID }}
      REPOBUDDY_APP_PRIVATE_KEY: ${{ secrets.REPOBUDDY_APP_PRIVATE_KEY }}

  # The release PR is the last point where the next publish is reviewable; after it
  # merges, release.yml publishes unattended. Only runs there, so ordinary PRs are
  # unaffected. Deliberately not a required check — it is skipped on every other PR,
  # and a skipped check never satisfies a required context.
  publish-gate:
    if: startsWith(github.head_ref, 'changeset-release/')
    uses: repobuddy/.github/.github/workflows/pnpm-publish-gate.yml@v2
    permissions:
      contents: read
    with:
      allowed-new-dependencies: cyber-agentkit

  mcp-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cyberuni/gap-analysis check
